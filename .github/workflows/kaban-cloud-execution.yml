name: KABAN Cloud Execution

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Canonical KABAN execution UUID
        required: true
        type: string

concurrency:
  group: kaban-execution-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KABAN_PERSISTENCE: cloud
      KABAN_SUPABASE_URL: ${{ secrets.KABAN_SUPABASE_URL }}
      KABAN_SUPABASE_SERVICE_KEY: ${{ secrets.KABAN_SUPABASE_SERVICE_KEY }}
      KABAN_R2_ENDPOINT_URL: ${{ secrets.KABAN_R2_ENDPOINT_URL }}
      KABAN_R2_BUCKET: ${{ secrets.KABAN_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KABAN_EXECUTION_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate execution ID
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: python -c 'import os; from uuid import UUID; UUID(os.environ["EXECUTION_ID"])'
      - name: Execute canonical KABAN job
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: python cloud_runtime.py execute --execution-id "$EXECUTION_ID"
