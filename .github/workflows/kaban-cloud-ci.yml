name: KABAN Cloud CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m unittest discover -s tests -p 'test*.py'

  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript checker
        working-directory: deploy/cloudflare/worker
        run: npm install --no-save typescript@5.8.3
      - name: Worker unit tests
        working-directory: deploy/cloudflare/worker
        run: npm test
      - name: Worker typecheck
        working-directory: deploy/cloudflare/worker
        run: npm run typecheck
